<g class="c2 c" xml:space="preserve" transform="translate(9 43)">
<text class="aa" y="14" textLength="999.6">Check: Uninstall removes the timer unit and the generated script, and leaves the git database and the program in place.</text>
<text class="aa" y="32" textLength="1008">Expect: After uninstall, the service file and auto-commit.sh are gone. The git database HEAD and dotfiles-timer.sh are s</text>
<text class="aa" y="50" textLength="100.8">till listed.</text>
<text class="aa" y="68" textLength="218.4">$ dotfiles-timer uninstall</text>
<text class="aa" y="86" textLength="294">Disabled dotfiles-git-commit.timer.</text>
<text class="aa" y="104" textLength="378">Removed dotfiles-git-commit.timer unit files.</text>
<text class="aa" y="122" textLength="604.8">The next two commands must fail. Those files are what uninstall removes.</text>
<text class="aa" y="140" textLength="487.2">$ ls -d ~/.config/systemd/user/dotfiles-git-commit.service</text>
<text class="aa" y="158" textLength="907.2">ls: cannot access &apos;/home/runner/.config/systemd/user/dotfiles-git-commit.service&apos;: No such file or directory</text>
<text class="aa" y="176" textLength="386.4">$ ls -d ~/.local/state/dotfiles/auto-commit.sh</text>
<text class="aa" y="194" textLength="806.4">ls: cannot access &apos;/home/runner/.local/state/dotfiles/auto-commit.sh&apos;: No such file or directory</text>
<text class="aa" y="212" textLength="336">$ ls -d ~/.local/share/dotfiles.git/HEAD</text>
<text class="aa" y="230" textLength="361.2">/home/runner/.local/share/dotfiles.git/HEAD</text>
<text class="aa" y="248" textLength="411.6">$ ls -d ~/.local/share/dotfiles/dotfiles-timer.sh</text>
<text class="aa" y="266" textLength="436.8">/home/runner/.local/share/dotfiles/dotfiles-timer.sh</text>
<text class="aa" y="284" textLength="772.8">Result: PASS. Uninstall removed the timer and the generated script, and left the repository.</text>
</g>
