<g class="c2 c" xml:space="preserve" transform="translate(9 43)">
<text class="aa" y="14" textLength="940.8">Check: Hooks point at the program .githooks directory, and the virtualenv is in the cache, not the program tree.</text>
<text class="aa" y="32" textLength="982.8">Expect: core.hooksPath is the program .githooks path. The cache pyvenv.cfg is listed. A program-tree .venv is absent.</text>
<text class="aa" y="50" textLength="319.2">$ dotfiles config --get core.hooksPath</text>
<text class="aa" y="68" textLength="369.6">/home/runner/.local/share/dotfiles/.githooks</text>
<text class="aa" y="86" textLength="436.8">$ ls -d ~/.cache/dotfiles/githooks-runner/pyvenv.cfg</text>
<text class="aa" y="104" textLength="462">/home/runner/.cache/dotfiles/githooks-runner/pyvenv.cfg</text>
<text class="aa" y="122" textLength="688.8">The next command must fail. The virtualenv is not created inside the program tree.</text>
<text class="aa" y="140" textLength="445.2">$ ls -d ~/.local/share/dotfiles/githooks-runner/.venv</text>
<text class="aa" y="158" textLength="865.2">ls: cannot access &apos;/home/runner/.local/share/dotfiles/githooks-runner/.venv&apos;: No such file or directory</text>
<text class="aa" y="176" textLength="730.8">Result: PASS. Hooks use the program directory, and the virtualenv is only in the cache.</text>
</g>
