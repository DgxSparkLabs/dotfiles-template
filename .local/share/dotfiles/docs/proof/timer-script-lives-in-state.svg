<g class="c2 c" xml:space="preserve" transform="translate(9 43)">
<text class="aa" y="14" textLength="949.2">Check: The timer runs the script in the state directory, not a copy in the git database or the program directory.</text>
<text class="aa" y="32" textLength="1008">Expect: auto-commit.sh is under ~/.local/state/dotfiles. The unit starts that path. The same name is absent from the git</text>
<text class="aa" x="8.4" y="50" textLength="294">database and the program directory.</text>
<text class="aa" y="68" textLength="386.4">$ ls -d ~/.local/state/dotfiles/auto-commit.sh</text>
<text class="aa" y="86" textLength="411.6">/home/runner/.local/state/dotfiles/auto-commit.sh</text>
<text class="aa" y="104" textLength="470.4">$ cat ~/.config/systemd/user/dotfiles-git-commit.service</text>
<text class="aa" y="122" textLength="50.4">[Unit]</text>
<text class="aa" y="140" textLength="403.2">Description=Auto-commit tracked dotfiles changes</text>
<text class="aa" y="158" textLength="226.8">After=network-online.target</text>
<text class="aa" y="176" textLength="226.8">Wants=network-online.target</text>
<text class="aa" y="212" textLength="75.6">[Service]</text>
<text class="aa" y="230" textLength="100.8">Type=oneshot</text>
<text class="aa" y="248" textLength="336">Environment=SSH_AUTH_SOCK=%t/keyring/ssh</text>
<text class="aa" y="266" textLength="1008">Environment=&quot;PATH=/home/runner/.local/bin:/home/runner/bin:/home/runner/.cargo/bin:/opt/hostedtoolcache/console2svg/late</text>
<text class="aa" y="284" textLength="1008">st/X64:/opt/hostedtoolcache/uv/0.12.21/x86_64:/home/runner/.local/bin:/snap/bin:/home/runner/.local/bin:/opt/pipx_bin:/h</text>
<text class="aa" y="302" textLength="1008">ome/runner/.cargo/bin:/home/runner/.config/composer/vendor/bin:/usr/local/.ghcup/bin:/home/runner/.dotnet/tools:/usr/loc</text>
<text class="aa" y="320" textLength="764.4">al/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin&quot;</text>
<text class="aa" y="338" textLength="495.6">ExecStart=/home/runner/.local/state/dotfiles/auto-commit.sh</text>
<text class="aa" y="356" textLength="630">The next two commands must fail. The generated script is not stored in git.</text>
<text class="aa" y="374" textLength="420">$ ls -d ~/.local/share/dotfiles.git/auto-commit.sh</text>
<text class="aa" y="392" textLength="840">ls: cannot access &apos;/home/runner/.local/share/dotfiles.git/auto-commit.sh&apos;: No such file or directory</text>
<text class="aa" y="410" textLength="386.4">$ ls -d ~/.local/share/dotfiles/auto-commit.sh</text>
<text class="aa" y="428" textLength="806.4">ls: cannot access &apos;/home/runner/.local/share/dotfiles/auto-commit.sh&apos;: No such file or directory</text>
<text class="aa" y="446" textLength="924">Result: PASS. The unit starts the state-directory script, and no copy sits in the git database or the program.</text>
</g>
