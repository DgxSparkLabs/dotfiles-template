<g id="c2r0" class="c2 c" xml:space="preserve">
<rect width="924" height="18" id="c2e0" fill="#0c0c0c"/>
<text class="aa" y="14" textLength="344.4">$ ls -d ~/.local/share/dotfiles/.githooks</text>
</g>
<g id="c2r1" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" y="14" textLength="369.6">/home/runner/.local/share/dotfiles/.githooks</text>
</g>
<g id="c2r2" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
</g>
<g id="c2r3" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" y="14" textLength="436.8">$ ls -l ~/.cache/dotfiles/githooks-runner/pyvenv.cfg</text>
</g>
<g id="c2r4" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" y="14" textLength="831.6">-rw-r--r-- 1 runner runner 140 Sep 30 22:04 /home/runner/.cache/dotfiles/githooks-runner/pyvenv.cfg</text>
</g>
<g id="c2r5" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" y="14" textLength="268.8">$ dotfiles-doctor --skip-network</text>
</g>
<g id="c2r6" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" y="14" textLength="621.6">dotfiles doctor — checking setup at /home/runner/.local/share/dotfiles.git</text>
</g>
<g id="c2r7" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" x="16.8" y="14" textLength="504">PASS  uv on PATH (/opt/hostedtoolcache/uv/0.12.21/x86_64/uv)</text>
</g>
<g id="c2r8" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" x="16.8" y="14" textLength="562.8">PASS  core.hooksPath = /home/runner/.local/share/dotfiles/.githooks</text>
</g>
<g id="c2r9" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" x="16.8" y="14" textLength="302.4">PASS  status.showUntrackedFiles = no</text>
</g>
<g id="c2r10" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" x="16.8" y="14" textLength="277.2">PASS  githooks-runner venv synced</text>
</g>
<g id="c2r11" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" x="16.8" y="14" textLength="352.8">PASS  work-tree clean (no tracked changes)</text>
</g>
<g id="c2r12" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" x="16.8" y="14" textLength="218.4">INFO  HEAD is &apos;ci-machine&apos;</text>
</g>
<g id="c2r13" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" x="16.8" y="14" textLength="554.4">INFO  system baseline ref = system (git config dotfiles.systemRef)</text>
</g>
<g id="c2r14" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" x="16.8" y="14" textLength="588">INFO  user_hooks.example not present (optional customization template)</text>
</g>
<g id="c2r15" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" x="16.8" y="14" textLength="722.4">INFO  user_hooks.py not activated (copy user_hooks.example to user_hooks.py to enable)</text>
</g>
<g id="c2r16" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" x="16.8" y="14" textLength="588">INFO  auto-commit timer not enabled (optional: dotfiles-timer install)</text>
</g>
<g id="c2r17" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" x="16.8" y="14" textLength="445.2">INFO  network/SSH push check skipped (--skip-network)</text>
</g>
<g id="c2r18" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" y="14" textLength="260.4">doctor: all hard checks PASSED.</text>
