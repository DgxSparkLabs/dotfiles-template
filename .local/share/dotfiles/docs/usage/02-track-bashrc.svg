<text class="aa" x="9" y="57">$ Track your bashrc</text></g>
<defs>
<g id="c2r0" class="c2 c" xml:space="preserve">
<rect width="924" height="18" id="c2e0" fill="#0c0c0c"/>
<text class="aa" y="14" textLength="126">$ ls -l .bashrc</text>
</g>
<g id="c2r1" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" y="14" textLength="420">-rw-r--r-- 1 runner runner 18 Sep 30 22:04 .bashrc</text>
</g>
<g id="c2r2" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
</g>
<g id="c2r3" class="c2 c"><use href="#c2r2"/>
<g xml:space="preserve">
<rect width="109.2" height="18" id="c2e1" fill="#0c0c0c" stroke="#0c0c0c" stroke-width="2" vector-effect="non-scaling-stroke"/>
<text class="aa" y="14" textLength="109.2">$ cat .bashrc</text>
</g>
</g>
<g id="c2r4" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" y="14" textLength="142.8">alias ll=&quot;ls -la&quot;</text>
</g>
<g id="c2r5" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" y="14" textLength="243.6">$ git check-ignore -v .bashrc</text>
</g>
<g id="c2r6" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" y="14" textLength="193.2">.gitignore:1:/* .bashrc</text>
</g>
<g id="c2r7" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" y="14" textLength="142.8">$ git add .bashrc</text>
</g>
<g id="c2r8" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" y="14" textLength="537.6">The following paths are ignored by one of your .gitignore files:</text>
</g>
<g id="c2r9" class="c2 c"><use href="#c2r2"/>
<g xml:space="preserve">
<rect width="58.8" height="18" id="c2e2" fill="#0c0c0c" stroke="#0c0c0c" stroke-width="2" vector-effect="non-scaling-stroke"/>
<text class="aa" y="14" textLength="58.8">.bashrc</text>
</g>
</g>
<g id="c2r10" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" y="14" textLength="369.6">hint: Use -f if you really want to add them.</text>
</g>
<g id="c2r11" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" y="14" textLength="638.4">hint: Disable this message with &quot;git config set advice.addIgnoredFile false&quot;</text>
</g>
<g id="c2r12" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" y="14" textLength="168">$ git add -f .bashrc</text>
</g>
<g id="c2r13" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" y="14" textLength="235.2">$ git commit -m &apos;Add bashrc&apos;</text>
</g>
<g id="c2r14" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" y="14" textLength="260.4">[ci-machine e75f6ac] Add bashrc</text>
</g>
<g id="c2r15" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" x="8.4" y="14" textLength="252">1 file changed, 1 insertion(+)</text>
</g>
<g id="c2r16" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" x="8.4" y="14" textLength="218.4">create mode 100644 .bashrc</text>
</g>
<g id="c2r17" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" y="14" textLength="184.8">$ git ls-files .bashrc</text>
</g>
