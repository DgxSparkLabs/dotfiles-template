<rect width="924" height="18" id="c2e0" fill="#0c0c0c"/>
<text class="aa" y="14" textLength="142.8">$ ls -l ~/.bashrc</text>
</g>
<g id="c2r1" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" y="14" textLength="529.2">-rw-r--r-- 1 runner runner 18 Sep 30 23:17 /home/runner/.bashrc</text>
</g>
<g id="c2r2" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
</g>
<g id="c2r3" class="c2 c"><use href="#c2r2"/>
<g xml:space="preserve">
<rect width="126" height="18" id="c2e1" fill="#0c0c0c" stroke="#0c0c0c" stroke-width="2" vector-effect="non-scaling-stroke"/>
<text class="aa" y="14" textLength="126">$ cat ~/.bashrc</text>
</g>
</g>
<g id="c2r4" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" y="14" textLength="142.8">alias ll=&quot;ls -la&quot;</text>
</g>
<g id="c2r5" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" y="14" textLength="302.4">$ dotfiles check-ignore -v ~/.bashrc</text>
</g>
<g id="c2r6" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" y="14" textLength="302.4">.gitignore:1:/* /home/runner/.bashrc</text>
</g>
<g id="c2r7" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" y="14" textLength="201.6">$ dotfiles add ~/.bashrc</text>
</g>
<g id="c2r8" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" y="14" textLength="537.6">The following paths are ignored by one of your .gitignore files:</text>
</g>
<g id="c2r9" class="c2 c"><use href="#c2r2"/>
<g xml:space="preserve">
<rect width="58.8" height="18" id="c2e2" fill="#0c0c0c" stroke="#0c0c0c" stroke-width="2" vector-effect="non-scaling-stroke"/>
<text class="aa" y="14" textLength="58.8">.bashrc</text>
</g>
</g>
<g id="c2r10" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" y="14" textLength="369.6">hint: Use -f if you really want to add them.</text>
</g>
<g id="c2r11" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" y="14" textLength="638.4">hint: Disable this message with &quot;git config set advice.addIgnoredFile false&quot;</text>
</g>
<g id="c2r12" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" y="14" textLength="226.8">$ dotfiles add -f ~/.bashrc</text>
</g>
<g id="c2r13" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" y="14" textLength="277.2">$ dotfiles commit -m &quot;Add bashrc&quot;</text>
</g>
<g id="c2r14" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" y="14" textLength="226.8">[laptop bfd04fc] Add bashrc</text>
</g>
<g id="c2r15" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" x="8.4" y="14" textLength="252">1 file changed, 1 insertion(+)</text>
</g>
<g id="c2r16" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" x="8.4" y="14" textLength="218.4">create mode 100644 .bashrc</text>
</g>
<g id="c2r17" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" y="14" textLength="252">$ dotfiles push -u origin HEAD</text>
</g>
<g id="c2r18" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" y="14" textLength="226.8">To /tmp/dotfiles-remote.git</text>
</g>
<g id="c2r19" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" x="25.2" y="14" textLength="268.8">a435fcb..bfd04fc  HEAD -&gt; laptop</text>
</g>
<g id="c2r20" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" y="14" textLength="403.2">branch &apos;laptop&apos; set up to track &apos;origin/laptop&apos;.</text>
</g>
<g id="c2r21" class="c2 c" xml:space="preserve">
<use href="#c2e0"/>
<text class="aa" y="14" textLength="176.4">$ dotfiles status -sb</text>
</g>
