name: unit
on:
  push:
  workflow_dispatch:

# L0 + L1 dispatcher tests across OS and shells (bash, zsh, pwsh).
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Expose the systemd USER session to subsequent steps so the timer tests (test_timer.sh)
      # can exercise the LIVE manager (L3.1/L3.14 unit count, enable/disable) on the ubuntu VM
      # instead of taking the named SKIP. The GH ubuntu runner is a VM (not a container) and has
      # a logind user session; XDG_RUNTIME_DIR makes `systemctl --user` reachable.
      - name: Export XDG_RUNTIME_DIR (systemd --user)
        if: runner.os == 'Linux'
        run: echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"

      # uv is required by the per-repo hook dispatch tests (test_hooks.*): the shared hook
      # stubs exec `uv run --project githooks-runner ...`. Without uv those tests fail loud
      # (by design) rather than skip. setup-uv puts uv on PATH for all later steps/shells.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Pre-build the runner venv once so the first hook commit doesn't race on `uv sync`.
      - name: Sync githooks-runner
        shell: bash
        run: uv sync --locked --project githooks-runner

      - name: bash harness (Linux/macOS)
        if: runner.os != 'Windows'
        run: bash tests/run.sh bash

      - name: zsh harness (macOS)
        if: runner.os == 'macOS'
        run: zsh tests/run.sh zsh

      - name: bash harness (Windows / Git-Bash)
        if: runner.os == 'Windows'
        shell: bash
        run: bash tests/run.sh bash

      - name: pwsh harness (all OS)
        shell: pwsh
        run: ./tests/run.ps1
