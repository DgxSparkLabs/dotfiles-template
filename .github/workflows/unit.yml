name: unit
on:
  push:
  workflow_dispatch:

# L0 + L1 dispatcher tests across OS and shells (bash, zsh, pwsh).
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # NOTE: we deliberately do NOT export XDG_RUNTIME_DIR here. GH ubuntu runners have NO
      # functional `systemd --user` instance — `systemctl --user enable/start` registers/finds zero
      # units even when XDG_RUNTIME_DIR is set (and `show-environment` can falsely succeed). The
      # timer tests' live-manager probe (have_systemd / actual register-and-verify) therefore takes
      # a NAMED SKIP for the live-manager-only assertions on CI, while the artifact-content and
      # direct `dotfiles -tick` assertions still run for real. See test_timer.sh.

      # uv is required by the per-repo hook dispatch tests (test_hooks.*): the shared hook
      # stubs exec `uv run --project githooks-runner ...`. Without uv those tests fail loud
      # (by design) rather than skip. setup-uv puts uv on PATH for all later steps/shells.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Pre-build the runner venv once so the first hook commit doesn't race on `uv sync`.
      - name: Sync githooks-runner
        shell: bash
        run: uv sync --locked --project githooks-runner

      - name: bash harness (Linux/macOS)
        if: runner.os != 'Windows'
        run: bash tests/run.sh bash

      - name: zsh harness (macOS)
        if: runner.os == 'macOS'
        run: zsh tests/run.sh zsh

      - name: bash harness (Windows / Git-Bash)
        if: runner.os == 'Windows'
        shell: bash
        run: bash tests/run.sh bash

      - name: pwsh harness (all OS)
        shell: pwsh
        run: ./tests/run.ps1
