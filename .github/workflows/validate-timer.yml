name: Validate Timer Scripts

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          echo "[validate-timer] git config --global user (ci@github-actions); runner=${{ runner.os }} sha=${{ github.sha }}"
          git config --global user.email "ci@github-actions"
          git config --global user.name "CI"

      # ── Linux: expose systemd user session to subsequent steps ────────────
      - name: Export XDG_RUNTIME_DIR
        if: runner.os == 'Linux'
        run: |
          echo "[validate-timer] XDG_RUNTIME_DIR for systemd --user"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"

      # ── uv on PATH: required by the git hooks runner (README "Git hooks") ─
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # ── Synthetic bare repo: local fake remote so push works without creds ─
      # macOS is Unix → reuses the exact Linux bash setup (only the temp path differs,
      # and /tmp exists on macOS too), so we gate on "not Windows".
      # NOTE: deprecate once bootstrap is proven. This inline checkout duplicates
      # what .dotfiles/bootstrap.{sh,ps1} now do; the dedicated bootstrap step
      # below exercises the real scripts. Keep both until the bootstrap step has
      # been green across a few runs, then collapse this into the bootstrap call.
      - name: Set up synthetic bare dotfiles repo (Linux/macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          set -euo pipefail
          git config --global init.defaultBranch master
          dotfiles() { git --git-dir="$HOME/.dotfiles/" --work-tree="$HOME" "$@"; }

          # cd to $HOME — git pathspecs are CWD-relative, and GHA puts us inside
          # the workspace which is a subdir of $HOME, so `.gitignore` would
          # otherwise resolve to `work/.../...gitignore` in master's tree. Real
          # users running the README from a normal shell are at $HOME or
          # elsewhere outside the workspace, so this matches their environment.
          cd "$HOME"

          # Stand up a synthetic "github.com/<YOU>/dotfiles.git" so the README's
          # `git clone --bare <remote-url>` simulation is faithful: a clean bare
          # remote that received this workspace's content via git push protocol.
          echo "[validate-timer] git init --bare /tmp/dotfiles-remote.git"
          git init --bare /tmp/dotfiles-remote.git
          echo "[validate-timer] push workspace HEAD -> /tmp/dotfiles-remote.git refs/heads/master"
          git -C "$GITHUB_WORKSPACE" push /tmp/dotfiles-remote.git "HEAD:refs/heads/master"
          # A machine uses its OWN branch, never the shared master baseline. Push a
          # distinct machine branch ("ci-machine") so the bootstrap smoke test can
          # check it out via --branch and prove the argument actually took effect
          # (a value != master that we can assert on HEAD).
          echo "[validate-timer] push workspace HEAD -> /tmp/dotfiles-remote.git refs/heads/ci-machine"
          git -C "$GITHUB_WORKSPACE" push /tmp/dotfiles-remote.git "HEAD:refs/heads/ci-machine"

          # README step 2: git clone --bare <remote-url> $HOME/.dotfiles
          echo "[validate-timer] git clone --bare /tmp/dotfiles-remote.git \"\$HOME/.dotfiles\""
          git clone --bare /tmp/dotfiles-remote.git "$HOME/.dotfiles"

          echo "[validate-timer] dotfiles config status.showUntrackedFiles no"
          dotfiles config status.showUntrackedFiles no

          echo "[validate-timer] dotfiles checkout master -- .gitignore .dotfiles/"
          dotfiles checkout master -- .gitignore .dotfiles/

          echo "[validate-timer] dotfiles add -u ."
          dotfiles add -u .
          echo "[validate-timer] dotfiles commit -m Init dotfiles"
          dotfiles commit -m "Init dotfiles"

          echo "[validate-timer] dotfiles push -u origin HEAD"
          dotfiles push -u origin HEAD
          echo "[validate-timer] bare repo setup done (Linux)"

      - name: Set up bare dotfiles repo (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config --global init.defaultBranch master
          function dotfiles { git --git-dir="$HOME/.dotfiles/" --work-tree="$HOME" @args }

          $ws = $env:GITHUB_WORKSPACE

          # Match a real user's shell: CWD outside the workspace so git
          # pathspecs (which are CWD-relative) resolve at the work-tree root.
          Set-Location $HOME

          # Stand up a synthetic "github.com/<YOU>/dotfiles.git" so the README's
          # `git clone --bare <remote-url>` simulation is faithful: a clean bare
          # remote that received this workspace's content via git push protocol,
          # not a local->local hardlink-clone (which would inherit sparse-checkout
          # and worktree-config files from the workspace .git).
          Write-Host "[validate-timer] git init --bare C:\dotfiles-remote.git"
          git init --bare C:\dotfiles-remote.git
          Write-Host "[validate-timer] push workspace HEAD -> C:\dotfiles-remote.git refs/heads/master"
          git -C "$ws" push C:\dotfiles-remote.git "HEAD:refs/heads/master"
          # A machine uses its OWN branch, never the shared master baseline. Push a
          # distinct machine branch ("ci-machine") so the bootstrap smoke test can
          # check it out via -Branch and prove the argument actually took effect
          # (a value != master that we can assert on HEAD).
          Write-Host "[validate-timer] push workspace HEAD -> C:\dotfiles-remote.git refs/heads/ci-machine"
          git -C "$ws" push C:\dotfiles-remote.git "HEAD:refs/heads/ci-machine"

          # README step 2: git clone --bare <remote-url> $HOME/.dotfiles
          Write-Host "[validate-timer] git clone --bare C:\dotfiles-remote.git `"$HOME/.dotfiles`""
          git clone --bare C:\dotfiles-remote.git "$HOME/.dotfiles"

          Write-Host "[validate-timer] dotfiles config status.showUntrackedFiles no"
          dotfiles config status.showUntrackedFiles no

          Write-Host "[validate-timer] dotfiles checkout master -- .gitignore .dotfiles/"
          dotfiles checkout master -- .gitignore .dotfiles/

          Write-Host "[validate-timer] dotfiles add -u ."
          dotfiles add -u .
          Write-Host "[validate-timer] dotfiles commit -m Init dotfiles"
          dotfiles commit -m "Init dotfiles"
          Write-Host "[validate-timer] dotfiles push -u origin HEAD"
          dotfiles push -u origin HEAD
          Write-Host "[validate-timer] bare repo setup done (Windows)"

      # ── Bootstrap smoke test: run the REAL tracked bootstrap script ────────
      # Drives .dotfiles/bootstrap.{sh,ps1} against the synthetic remote into a
      # FRESH git-dir (separate from the inline $HOME/.dotfiles above), asserting
      # a clean checkout + showUntrackedFiles=no. Two paths are exercised:
      #   Test 1 (arguments): --repo/--branch ci-machine, fully non-interactive,
      #     asserting HEAD lands on ci-machine (proves the --branch arg took
      #     effect — a non-master value distinct from the shared baseline).
      #   Test 2 (-y):  no --branch, -y auto-accepts the auto-detected machine
      #     name. We replicate the script's exact detection here, push that name
      #     as a branch on the synthetic remote, then run with -y and assert HEAD
      #     lands on the detected name with no prompt/hang — a real end-to-end
      #     check of the -y auto-accept precedence.
      - name: Bootstrap smoke test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          # We run a tweaked copy with GITDIR redirected to a fresh dir so the
          # smoke test does not touch the runner's real dotfiles. The
          # branch-resolution logic (arguments, -y, prompt, TTY guard) is
          # preserved verbatim. (The script no longer reloads the shell.)
          make_ci_copy() {  # $1 = git-dir to use
            sed -e 's#\$HOME/\.dotfiles#'"$1"'#g' \
                "$GITHUB_WORKSPACE/.dotfiles/bootstrap.sh"
          }

          # ── Test 1: ARGUMENTS path (--repo + --branch ci-machine) ──────────
          GITDIR1="$HOME/.dotfiles-bootstrap"
          dotfiles1() { git --git-dir="$GITDIR1/" --work-tree="$HOME" "$@"; }
          echo "[validate-timer] Test 1: bootstrap.sh --branch ci-machine -> $GITDIR1"
          make_ci_copy "$GITDIR1" > /tmp/bootstrap-ci.sh
          bash /tmp/bootstrap-ci.sh --repo /tmp/dotfiles-remote.git --branch ci-machine

          echo "[validate-timer] Test 1: assert clean checkout (no pending changes)"
          test -f "$HOME/.gitignore" || { echo "FAIL: .gitignore not checked out"; exit 1; }
          test -f "$HOME/.dotfiles/bootstrap.sh" || { echo "FAIL: .dotfiles/bootstrap.sh not checked out"; exit 1; }
          STATUS=$(dotfiles1 status --porcelain)
          [ -z "$STATUS" ] || { echo "FAIL: dirty checkout:"; echo "$STATUS"; exit 1; }

          echo "[validate-timer] Test 1: assert showUntrackedFiles=no"
          VAL=$(dotfiles1 config --local --get status.showUntrackedFiles)
          [ "$VAL" = "no" ] || { echo "FAIL: showUntrackedFiles=$VAL (expected no)"; exit 1; }

          echo "[validate-timer] Test 1: assert HEAD on ci-machine (--branch took effect)"
          HEAD1=$(dotfiles1 rev-parse --abbrev-ref HEAD)
          [ "$HEAD1" = "ci-machine" ] || { echo "FAIL: HEAD=$HEAD1 (expected ci-machine)"; exit 1; }
          echo "[validate-timer] Test 1 ok (Linux): HEAD=$HEAD1"

          # ── Test 2: -y path (auto-accept auto-detected branch, no --branch) ─
          # Replicate the script's detect_branch() exactly so we can pre-create
          # the matching branch on the synthetic remote.
          if grep -qiE '(microsoft|wsl)' /proc/version 2>/dev/null; then
            DETECTED="WSL"
          elif [ -r /sys/class/dmi/id/board_name ]; then
            DETECTED="$(cat /sys/class/dmi/id/board_name)"
          else
            DETECTED="$(hostname)"
          fi
          echo "[validate-timer] Test 2: detected branch name = '$DETECTED'"
          GITDIR2="$HOME/.dotfiles-bootstrap-y"
          dotfiles2() { git --git-dir="$GITDIR2/" --work-tree="$HOME" "$@"; }
          make_ci_copy "$GITDIR2" > /tmp/bootstrap-ci-y.sh

          if git check-ref-format --branch "$DETECTED" >/dev/null 2>&1; then
            # Detected name is a usable branch (the happy end-to-end case): mint it
            # on the synthetic remote, run -y with NO --branch, assert HEAD lands on
            # the detected name. </dev/null proves no stdin/prompt is read.
            echo "[validate-timer] Test 2: push master:$DETECTED onto synthetic remote"
            git -C "$GITHUB_WORKSPACE" push /tmp/dotfiles-remote.git "HEAD:refs/heads/$DETECTED"
            echo "[validate-timer] Test 2: bootstrap.sh -y (NO --branch) -> $GITDIR2"
            bash /tmp/bootstrap-ci-y.sh --repo /tmp/dotfiles-remote.git -y </dev/null
            echo "[validate-timer] Test 2: assert HEAD on detected branch '$DETECTED' (-y auto-accepted, no prompt)"
            HEAD2=$(dotfiles2 rev-parse --abbrev-ref HEAD)
            [ "$HEAD2" = "$DETECTED" ] || { echo "FAIL: HEAD=$HEAD2 (expected $DETECTED)"; exit 1; }
            echo "[validate-timer] Test 2 ok (Linux, e2e): HEAD=$HEAD2"
          else
            # GHA runners report a board_name with a space (e.g. "Virtual
            # Machine") which is not a valid single git ref, so we can't mint that
            # branch. Per the PR note, we still prove the two things that matter
            # for -y: (1) it is fully NON-INTERACTIVE (run with </dev/null; if -y
            # didn't short-circuit the prompt it would either hit the no-TTY error
            # or block on read), and (2) it RESOLVES TO THE DETECTED NAME — the
            # script announces "auto-accepting detected branch: <name>" on stderr,
            # which we assert equals $DETECTED. The clone then fails on the
            # space-y branch (expected) without ever prompting.
            echo "[validate-timer] Test 2: detected name not a valid git ref; assert -y is non-interactive + resolves to it via the script's own resolution log"
            set +e
            OUT=$(bash /tmp/bootstrap-ci-y.sh --repo /tmp/dotfiles-remote.git -y </dev/null 2>&1)
            RC=$?
            set -e
            printf '%s\n' "$OUT"
            echo "$OUT" | grep -qF "auto-accepting detected branch: $DETECTED" \
              || { echo "FAIL: -y did not resolve to detected name '$DETECTED' non-interactively"; exit 1; }
            echo "$OUT" | grep -q 'stdin is not a TTY' \
              && { echo "FAIL: -y fell through to the non-interactive prompt guard (did not auto-accept)"; exit 1; }
            [ "$RC" -ne 0 ] || { echo "FAIL: expected clone to fail on the space-y branch name"; exit 1; }
            echo "[validate-timer] Test 2 ok (Linux, non-interactive -y resolves to '$DETECTED'; clone failed on space-y ref as expected)"
          fi
          echo "[validate-timer] bootstrap smoke test ok (Linux)"

      - name: Bootstrap smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # We run a tweaked copy with git-dir redirected to a fresh dir so the
          # smoke test does not touch the runner's real dotfiles. The
          # branch-resolution logic (-Branch, -y, prompt, interactive guard) is
          # preserved verbatim. (The script no longer reloads the profile.)
          function Make-CiCopy([string]$gitdir, [string]$dest) {
            $src = Get-Content "$env:GITHUB_WORKSPACE/.dotfiles/bootstrap.ps1" -Raw
            $src = $src -replace '\$HOME/\.dotfiles', $gitdir
            Set-Content -Path $dest -Value $src
          }

          # ── Test 1: ARGUMENTS path (-Repo + -Branch ci-machine) ────────────
          $gitdir1 = "$HOME/.dotfiles-bootstrap"
          function dotfiles1 { git --git-dir="$gitdir1/" --work-tree="$HOME" @args }
          Write-Host "[validate-timer] Test 1: bootstrap.ps1 -Branch ci-machine -> $gitdir1"
          Make-CiCopy $gitdir1 "$env:RUNNER_TEMP/bootstrap-ci.ps1"
          & pwsh "$env:RUNNER_TEMP/bootstrap-ci.ps1" -Repo C:\dotfiles-remote.git -Branch ci-machine
          if ($LASTEXITCODE -ne 0) { throw "bootstrap.ps1 exited $LASTEXITCODE" }

          Write-Host "[validate-timer] Test 1: assert clean checkout (no pending changes)"
          if (-not (Test-Path "$HOME/.gitignore")) { throw "FAIL: .gitignore not checked out" }
          if (-not (Test-Path "$HOME/.dotfiles/bootstrap.ps1")) { throw "FAIL: .dotfiles/bootstrap.ps1 not checked out" }
          $status = dotfiles1 status --porcelain
          if ($status) { throw "FAIL: dirty checkout:`n$status" }

          Write-Host "[validate-timer] Test 1: assert showUntrackedFiles=no"
          $val = dotfiles1 config --local --get status.showUntrackedFiles
          if ($val -ne 'no') { throw "FAIL: showUntrackedFiles=$val (expected no)" }

          Write-Host "[validate-timer] Test 1: assert HEAD on ci-machine (-Branch took effect)"
          $head1 = (dotfiles1 rev-parse --abbrev-ref HEAD).Trim()
          if ($head1 -ne 'ci-machine') { throw "FAIL: HEAD=$head1 (expected ci-machine)" }
          Write-Host "[validate-timer] Test 1 ok (Windows): HEAD=$head1"

          # ── Test 2: -y path (auto-accept auto-detected branch, no -Branch) ─
          # Replicate the script's Get-MachineBranch exactly so we can pre-create
          # the matching branch on the synthetic remote.
          $detected = $null
          try {
            $product = (Get-WmiObject Win32_BaseBoard -ErrorAction Stop).product
            if ($product) { $detected = $product.Trim() }
          } catch { }
          if (-not $detected) { $detected = $env:COMPUTERNAME }
          Write-Host "[validate-timer] Test 2: detected branch name = '$detected'"
          $gitdir2 = "$HOME/.dotfiles-bootstrap-y"
          function dotfiles2 { git --git-dir="$gitdir2/" --work-tree="$HOME" @args }
          Make-CiCopy $gitdir2 "$env:RUNNER_TEMP/bootstrap-ci-y.ps1"

          git check-ref-format --branch "$detected" 2>$null | Out-Null
          $validRef = ($LASTEXITCODE -eq 0)
          # On the GHA Windows host [Environment]::UserInteractive is true, so
          # WITHOUT -y this would hit Read-Host and block. We pipe $null to stdin
          # so any stray prompt fails fast instead of hanging; -y must
          # short-circuit the prompt entirely and resolve to $detected.
          if ($validRef) {
            # Happy end-to-end case: mint the detected branch, run -y with NO
            # -Branch, assert HEAD lands on it.
            Write-Host "[validate-timer] Test 2: push master:$detected onto synthetic remote"
            git -C "$env:GITHUB_WORKSPACE" push C:\dotfiles-remote.git "HEAD:refs/heads/$detected"
            if ($LASTEXITCODE -ne 0) { throw "push of detected branch failed (exit $LASTEXITCODE)" }
            Write-Host "[validate-timer] Test 2: bootstrap.ps1 -y (NO -Branch) -> $gitdir2"
            $null | & pwsh "$env:RUNNER_TEMP/bootstrap-ci-y.ps1" -Repo C:\dotfiles-remote.git -y
            if ($LASTEXITCODE -ne 0) { throw "bootstrap.ps1 -y exited $LASTEXITCODE" }
            Write-Host "[validate-timer] Test 2: assert HEAD on detected branch '$detected' (-y auto-accepted, no prompt)"
            $head2 = (dotfiles2 rev-parse --abbrev-ref HEAD).Trim()
            if ($head2 -ne $detected) { throw "FAIL: HEAD=$head2 (expected $detected)" }
            Write-Host "[validate-timer] Test 2 ok (Windows, e2e): HEAD=$head2"
          }
          else {
            # GHA runners report a board_name with a space (e.g. "Virtual
            # Machine"), not a valid single git ref. Per the PR note we still prove
            # -y is (1) NON-INTERACTIVE and (2) RESOLVES TO THE DETECTED NAME: the
            # script announces "auto-accepting detected branch: <name>", which we
            # assert equals $detected. The clone then fails on the space-y branch
            # (expected) without ever prompting.
            Write-Host "[validate-timer] Test 2: detected name not a valid git ref; assert -y is non-interactive + resolves to it via the script's own resolution log"
            $out = ($null | & pwsh "$env:RUNNER_TEMP/bootstrap-ci-y.ps1" -Repo C:\dotfiles-remote.git -y 2>&1 | Out-String)
            Write-Host $out
            if ($out -notmatch [regex]::Escape("auto-accepting detected branch: $detected")) {
              throw "FAIL: -y did not resolve to detected name '$detected' non-interactively"
            }
            if ($out -match 'host is non-interactive') {
              throw "FAIL: -y fell through to the non-interactive guard (did not auto-accept)"
            }
            Write-Host "[validate-timer] Test 2 ok (Windows, non-interactive -y resolves to '$detected'; clone failed on space-y ref as expected)"
          }
          Write-Host "[validate-timer] bootstrap smoke test ok (Windows)"

      # ── README "Git hooks (optional)": uv sync + core.hooksPath + smoke test ─
      - name: Set up git hooks (Linux/macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dotfiles() { git --git-dir="$HOME/.dotfiles/" --work-tree="$HOME" "$@"; }
          cd "$HOME"

          echo "[validate-timer] uv sync --project \$HOME/.dotfiles/githooks-runner"
          uv sync --project "$HOME/.dotfiles/githooks-runner"

          echo "[validate-timer] dotfiles config core.hooksPath \$HOME/.dotfiles/.githooks"
          dotfiles config core.hooksPath "$HOME/.dotfiles/.githooks"
          echo "[validate-timer] verify: dotfiles config --get core.hooksPath"
          dotfiles config --get core.hooksPath

          echo "[validate-timer] smoke-test: direct pre-commit stub with verbose logging"
          DOTFILES_GITHOOKS_VERBOSE=1 sh "$HOME/.dotfiles/.githooks/pre-commit" 2>&1 \
            | tee "$RUNNER_TEMP/githooks-smoke.log"
          grep -q '\[dotfiles_githooks\] pre-commit' "$RUNNER_TEMP/githooks-smoke.log" \
            || { echo "FAIL: pre-commit stub did not invoke runner"; exit 1; }

          echo "[validate-timer] integration: dotfiles commit --allow-empty triggers configured hooks"
          DOTFILES_GITHOOKS_VERBOSE=1 dotfiles commit --allow-empty -m "hooks: smoke" 2>&1 \
            | tee "$RUNNER_TEMP/githooks-commit.log"
          grep -q '\[dotfiles_githooks\] pre-commit' "$RUNNER_TEMP/githooks-commit.log" \
            || { echo "FAIL: pre-commit did not fire on dotfiles commit"; exit 1; }
          grep -q '\[dotfiles_githooks\] commit-msg' "$RUNNER_TEMP/githooks-commit.log" \
            || { echo "FAIL: commit-msg did not fire on dotfiles commit"; exit 1; }
          echo "[validate-timer] git hooks setup ok (Linux)"

      - name: Set up git hooks (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function dotfiles { git --git-dir="$HOME/.dotfiles/" --work-tree="$HOME" @args }
          Set-Location $HOME

          Write-Host "[validate-timer] uv sync --project `$HOME/.dotfiles/githooks-runner"
          uv sync --project "$HOME/.dotfiles/githooks-runner"
          if ($LASTEXITCODE -ne 0) { throw "uv sync failed (exit $LASTEXITCODE)" }

          Write-Host "[validate-timer] dotfiles config core.hooksPath `$HOME/.dotfiles/.githooks"
          dotfiles config core.hooksPath "$HOME/.dotfiles/.githooks"
          Write-Host "[validate-timer] verify: dotfiles config --get core.hooksPath"
          dotfiles config --get core.hooksPath

          Write-Host "[validate-timer] integration: dotfiles commit --allow-empty triggers configured hooks"
          $env:DOTFILES_GITHOOKS_VERBOSE = "1"
          try {
              $out = dotfiles commit --allow-empty -m "hooks: smoke" 2>&1 | Out-String
          } finally {
              $env:DOTFILES_GITHOOKS_VERBOSE = $null
          }
          Write-Host $out
          if ($out -notmatch '\[dotfiles_githooks\] pre-commit') {
              throw "FAIL: pre-commit did not fire on dotfiles commit"
          }
          if ($out -notmatch '\[dotfiles_githooks\] commit-msg') {
              throw "FAIL: commit-msg did not fire on dotfiles commit"
          }
          Write-Host "[validate-timer] git hooks setup ok (Windows)"

      # ── README "Per-machine git identity": [include] of ~/.gitconfig.local ─
      # Note: runs in $RUNNER_TEMP, not $HOME — the runner's real ~/.gitconfig
      # is left untouched (the synthetic dotfiles repo above depends on it).
      - name: "Validate gitconfig.example [include] resolves sentinel email (Linux)"
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/gitid-home"
          mkdir -p "$home"
          echo "[validate-timer] copy .dotfiles/gitconfig.example -> \$HOME/.gitconfig"
          cp .dotfiles/gitconfig.example "$home/.gitconfig"
          echo "[validate-timer] write per-machine \$HOME/.gitconfig.local with sentinel email"
          printf '[user]\n\temail = sentinel@dotfiles.test\n' > "$home/.gitconfig.local"

          repo="$RUNNER_TEMP/gitid-repo"
          mkdir -p "$repo"
          git -C "$repo" init -q
          echo "[validate-timer] assert git config --get user.email resolves sentinel in a normal repo"
          got=$(HOME="$home" git -C "$repo" config --get user.email)
          echo "[validate-timer] resolved user.email = $got"
          [ "$got" = "sentinel@dotfiles.test" ] \
            || { echo "FAIL: expected sentinel@dotfiles.test, got '$got'"; exit 1; }
          echo "[validate-timer] PASS: [include] of ~/.gitconfig.local resolves (Linux)"

      - name: "Validate gitconfig.example [include] resolves sentinel email (Windows)"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # NB: $HOME is a read-only PowerShell automatic variable — assigning to
          # it (even as $home, names are case-insensitive) throws. Use $gitidHome.
          $gitidHome = Join-Path $env:RUNNER_TEMP 'gitid-home'
          New-Item -ItemType Directory -Force -Path $gitidHome | Out-Null
          Write-Host "[validate-timer] copy .dotfiles/gitconfig.example -> `$HOME/.gitconfig"
          Copy-Item '.dotfiles/gitconfig.example' (Join-Path $gitidHome '.gitconfig') -Force
          Write-Host "[validate-timer] write per-machine `$HOME/.gitconfig.local with sentinel email"
          "[user]`n`temail = sentinel@dotfiles.test" | Set-Content (Join-Path $gitidHome '.gitconfig.local')

          $repo = Join-Path $env:RUNNER_TEMP 'gitid-repo'
          New-Item -ItemType Directory -Force -Path $repo | Out-Null
          git -C $repo init -q
          Write-Host "[validate-timer] assert git config --get user.email resolves sentinel in a normal repo"
          # git on Windows expands `~` in the [include] path via $HOME when set;
          # point it at our temp home so the include resolves the sentinel .local.
          $env:HOME = $gitidHome
          try {
              $got = (git -C $repo config --get user.email).Trim()
          } finally {
              $env:HOME = $null
          }
          Write-Host "[validate-timer] resolved user.email = $got"
          if ($got -ne 'sentinel@dotfiles.test') {
              throw "FAIL: expected sentinel@dotfiles.test, got '$got'"
          }
          Write-Host "[validate-timer] PASS: [include] of ~/.gitconfig.local resolves (Windows)"

      # ── Install ──────────────────────────────────────────────────────────
      - name: Install systemd timer
        if: runner.os == 'Linux'
        run: |
          echo "[validate-timer] dotfiles-timer.sh install"
          bash .dotfiles/dotfiles-timer.sh install
          echo "[validate-timer] dotfiles-timer.sh install ok"

      # macOS: install writes the plist; `launchctl bootstrap` needs a GUI
      # (aqua) session that headless runners lack, so the install soft-skips
      # the bootstrap and still writes the plist. We assert the plist below.
      - name: Install launchd agent (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          echo "[validate-timer] dotfiles-timer.sh install (launchd; bootstrap may soft-skip)"
          bash .dotfiles/dotfiles-timer.sh install || true
          test -f "$HOME/Library/LaunchAgents/dotfiles-git-commit.plist" \
            || { echo "FAIL: plist not written"; exit 1; }
          echo "[validate-timer] dotfiles-timer.sh install ok (plist present)"

      - name: Install Task Scheduler task
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "[validate-timer] dotfiles-timer.ps1 install"
          pwsh .dotfiles/dotfiles-timer.ps1 install
          Write-Host "[validate-timer] dotfiles-timer.ps1 install ok"

      # ── Smoke test: scheduler registration ──────────────────────────────
      - name: Verify systemd timer registered
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          echo "[validate-timer] systemd user timer: list + is-enabled"
          systemctl --user list-timers --all
          systemctl --user is-enabled dotfiles-git-commit.timer
          echo "[validate-timer] assert service unit sets Environment=PATH (incl. \$HOME/.local/bin)"
          grep -E '^Environment=("?)PATH=' "$HOME/.config/systemd/user/dotfiles-git-commit.service" \
            | tee /dev/stderr \
            | grep -q "$HOME/.local/bin" \
            || { echo "FAIL: service unit missing Environment=PATH directive that includes \$HOME/.local/bin"; exit 1; }
          echo "[validate-timer] systemd timer ok"

      - name: Verify Task Scheduler task registered
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "[validate-timer] Get-ScheduledTask dotfiles-git-commit"
          $task = Get-ScheduledTask -TaskName 'dotfiles-git-commit' -ErrorAction Stop
          Write-Host "[validate-timer] Task state: $($task.State)"
          Write-Host "[validate-timer] Next run:   $((Get-ScheduledTaskInfo -TaskName 'dotfiles-git-commit').NextRunTime)"

      # ── macOS: assert plist correctness (StartInterval 60, PATH + ──────────
      #    SSH_AUTH_SOCK env keys, ProgramArguments points at .auto-commit.sh) ─
      - name: Verify launchd plist correctness (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          plist="$HOME/Library/LaunchAgents/dotfiles-git-commit.plist"
          test -f "$plist" || { echo "FAIL: missing $plist"; exit 1; }
          echo "[validate-timer] plist contents:"
          cat "$plist"

          echo "[validate-timer] assert StartInterval 60"
          # PlistBuddy reads the typed integer; fall back to grep if unavailable.
          if /usr/libexec/PlistBuddy -c 'Print :StartInterval' "$plist" 2>/dev/null | grep -qx '60'; then
            :
          else
            grep -A1 '<key>StartInterval</key>' "$plist" | grep -q '<integer>60</integer>' \
              || { echo "FAIL: StartInterval is not 60"; exit 1; }
          fi

          echo "[validate-timer] assert ProgramArguments -> /bin/bash + .auto-commit.sh"
          grep -q '<string>/bin/bash</string>' "$plist" \
            || { echo "FAIL: ProgramArguments missing /bin/bash"; exit 1; }
          grep -q "$HOME/.dotfiles/.auto-commit.sh" "$plist" \
            || { echo "FAIL: plist does not point at .auto-commit.sh"; exit 1; }

          echo "[validate-timer] assert EnvironmentVariables has PATH (incl. \$HOME/.local/bin) + SSH_AUTH_SOCK"
          grep -q '<key>PATH</key>' "$plist" \
            || { echo "FAIL: plist EnvironmentVariables missing PATH key"; exit 1; }
          grep -q "$HOME/.local/bin" "$plist" \
            || { echo "FAIL: PATH does not include \$HOME/.local/bin"; exit 1; }
          grep -q '<key>SSH_AUTH_SOCK</key>' "$plist" \
            || { echo "FAIL: plist EnvironmentVariables missing SSH_AUTH_SOCK key"; exit 1; }

          echo "[validate-timer] assert StandardOut/ErrorPath under logs dir"
          grep -q '<key>StandardOutPath</key>' "$plist" \
            || { echo "FAIL: plist missing StandardOutPath"; exit 1; }
          grep -q '<key>StandardErrorPath</key>' "$plist" \
            || { echo "FAIL: plist missing StandardErrorPath"; exit 1; }
          echo "[validate-timer] launchd plist ok"

      # ── Validate embedded git add mode (-u default, -A after reinstall) ─────
      - name: "Validate .auto-commit embeds git add -u after install (Linux/macOS)"
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          set -euo pipefail
          echo "[validate-timer] check .auto-commit.sh uses git add -u"
          f="$HOME/.dotfiles/.auto-commit.sh"
          test -f "$f"
          line=$(grep -E '^git .* add -[uA]' "$f" | head -n1)
          [ -n "$line" ] || { echo "FAIL: no git add staging line"; exit 1; }
          echo "[validate-timer] Staging line: $line"
          echo "$line" | grep -q 'add -u'
          echo "$line" | grep -q 'add -A' && { echo "FAIL: expected git add -u on staging line"; exit 1; }
          echo "[validate-timer] PASS: generated script uses git add -u"

      - name: "Validate .auto-commit.ps1 embeds git add -u after install (Windows)"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "[validate-timer] check .auto-commit.ps1 uses git add -u"
          $f = Join-Path $env:USERPROFILE '.dotfiles\.auto-commit.ps1'
          if (-not (Test-Path $f)) { throw "missing $f" }
          $hits = @(Select-String -Path $f -Pattern '^\s*& git @gitArgs add -(u|A)')
          if ($hits.Count -eq 0) { throw "FAIL: no '& git @gitArgs add -u|-A' line in $f" }
          $line = $hits[0].Line
          Write-Host "[validate-timer] Staging line: $line"
          if ($line -notmatch 'add -u\s*$') { throw "FAIL: expected '& git @gitArgs add -u', got: $line" }
          if ($line -match 'add -A') { throw "FAIL: unexpected add -A on staging line" }
          Write-Host "[validate-timer] PASS: generated script uses git add -u"

      # ── Unit test: commit fires when a tracked file changes ──────────────
      - name: "Unit test: commit fires on file change (Linux/macOS)"
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          set -euo pipefail
          dotfiles() { git --git-dir="$HOME/.dotfiles/" --work-tree="$HOME" "$@"; }

          echo "[validate-timer] unit: change .gitignore -> .auto-commit.sh -> expect chore(dotfiles): commit"
          echo "# touched-by-ci" >> "$HOME/.gitignore"
          bash "$HOME/.dotfiles/.auto-commit.sh"
          COUNT=$(dotfiles log --oneline | wc -l)
          [ "$COUNT" -ge 2 ] || { echo "FAIL: expected commit, got $COUNT"; exit 1; }
          MSG=$(dotfiles log -1 --pretty=%s)
          echo "$MSG" | grep -E '^chore\(dotfiles\):' \
            || { echo "FAIL: unexpected message: $MSG"; exit 1; }
          echo "[validate-timer] PASS: $MSG"

      - name: "Unit test: commit fires on file change (Windows)"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function dotfiles { git --git-dir="$HOME/.dotfiles/" --work-tree="$HOME" @args }

          Write-Host "[validate-timer] unit: change .gitignore -> .auto-commit.ps1 -> expect chore(dotfiles): commit"
          "# touched-by-ci" | Add-Content "$env:USERPROFILE\.gitignore"
          & "$env:USERPROFILE\.dotfiles\.auto-commit.ps1"
          $count = (dotfiles log --oneline).Count
          if ($count -lt 2) { throw "FAIL: expected commit, got $count" }
          $msg = dotfiles log -1 --pretty=%s
          if ($msg -notmatch '^\s*chore\(dotfiles\):') { throw "FAIL: unexpected message: $msg" }
          Write-Host "[validate-timer] PASS: $msg"

      # ── Unit test: status surfaces last commit, no false staleness ───────
      - name: "Unit test: status shows Last commit, no false staleness (Linux)"
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          echo "[validate-timer] unit: status -> 'Last commit:' line, no fresh-commit WARNING"
          out=$(bash .dotfiles/dotfiles-timer.sh status 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q 'Last commit:' \
            || { echo "FAIL: status missing 'Last commit:'"; exit 1; }
          if echo "$out" | grep -q 'WARNING: timer may be stuck'; then
            echo "FAIL: false staleness warning right after a fresh commit"; exit 1
          fi
          echo "[validate-timer] PASS: status surfaced last commit, no false staleness"

      - name: "Unit test: status shows Last commit, no false staleness (Windows)"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "[validate-timer] unit: status -> 'Last commit:' line, no fresh-commit WARNING"
          # Get-Status emits via Write-Host (the information stream, 6), so 2>&1 alone
          # (which merges only the error stream) would never capture the 'Last commit:'
          # line — the assertion would then throw despite status printing it. Merge ALL
          # streams with *>&1 so $out holds exactly what a user sees on the console.
          $out = & (Join-Path $env:GITHUB_WORKSPACE '.dotfiles/dotfiles-timer.ps1') -Action status *>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'Last commit:') { throw "FAIL: status missing 'Last commit:'" }
          if ($out -match 'WARNING: timer may be stuck') { throw "FAIL: false staleness warning right after a fresh commit" }
          Write-Host "[validate-timer] PASS: status surfaced last commit, no false staleness"

      # ── Unit test: no spurious commit when nothing changed ───────────────
      - name: "Unit test: no commit when nothing changed (Linux/macOS)"
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          set -euo pipefail
          dotfiles() { git --git-dir="$HOME/.dotfiles/" --work-tree="$HOME" "$@"; }

          echo "[validate-timer] unit: clean tree -> .auto-commit.sh -> HEAD unchanged"
          BEFORE=$(dotfiles log -1 --pretty=%H)
          bash "$HOME/.dotfiles/.auto-commit.sh"
          AFTER=$(dotfiles log -1 --pretty=%H)
          [ "$BEFORE" = "$AFTER" ] \
            || { echo "FAIL: unexpected commit when nothing changed"; exit 1; }
          echo "[validate-timer] PASS: no spurious commit"

      - name: "Unit test: no commit when nothing changed (Windows)"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function dotfiles { git --git-dir="$HOME/.dotfiles/" --work-tree="$HOME" @args }

          Write-Host "[validate-timer] unit: clean tree -> .auto-commit.ps1 -> HEAD unchanged"
          $before = dotfiles log -1 --pretty=%H
          & "$env:USERPROFILE\.dotfiles\.auto-commit.ps1"
          $after  = dotfiles log -1 --pretty=%H
          if ($before -ne $after) { throw "FAIL: unexpected commit when nothing changed" }
          Write-Host "[validate-timer] PASS: no spurious commit"

      - name: "Reinstall with git add -A (Linux)"
        if: runner.os == 'Linux'
        run: |
          echo "[validate-timer] dotfiles-timer.sh reinstall --all"
          bash .dotfiles/dotfiles-timer.sh reinstall '--all'
          echo "[validate-timer] reinstall --all ok"

      - name: "Reinstall with git add -A (macOS)"
        if: runner.os == 'macOS'
        run: |
          echo "[validate-timer] dotfiles-timer.sh reinstall --all"
          # reinstall re-runs launchctl bootstrap which soft-skips when
          # session-less; the regenerated .auto-commit.sh is what we assert next.
          bash .dotfiles/dotfiles-timer.sh reinstall '--all' || true
          echo "[validate-timer] reinstall --all ok"

      - name: "Reinstall with git add -A (Windows)"
        if: runner.os == 'Windows'
        shell: pwsh
        # Invoke script in this pwsh session with named params — avoids nested `pwsh ... -AddAll` binding to the host.
        # (& must not start the YAML scalar — bare `&` is interpreted as a YAML anchor.)
        run: |
          Write-Host "[validate-timer] dotfiles-timer.ps1 reinstall -AddAll"
          & (Join-Path $env:GITHUB_WORKSPACE '.dotfiles/dotfiles-timer.ps1') -Action reinstall -AddAll
          Write-Host "[validate-timer] reinstall -AddAll ok"

      - name: "Validate .auto-commit embeds git add -A after reinstall --all (Linux/macOS)"
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          set -euo pipefail
          echo "[validate-timer] check .auto-commit.sh uses git add -A after reinstall --all"
          f="$HOME/.dotfiles/.auto-commit.sh"
          line=$(grep -E '^git .* add -[uA]' "$f" | head -n1)
          [ -n "$line" ] || { echo "FAIL: no git add staging line"; exit 1; }
          echo "[validate-timer] Staging line: $line"
          echo "$line" | grep -q 'add -A'
          echo "$line" | grep -q 'add -u' && { echo "FAIL: expected git add -A on staging line"; exit 1; }
          echo "[validate-timer] PASS: generated script uses git add -A"

      - name: "Validate .auto-commit.ps1 embeds git add -A after reinstall -AddAll (Windows)"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "[validate-timer] check .auto-commit.ps1 uses git add -A after reinstall -AddAll"
          $f = Join-Path $env:USERPROFILE '.dotfiles\.auto-commit.ps1'
          $hits = @(Select-String -Path $f -Pattern '^\s*& git @gitArgs add -(u|A)')
          if ($hits.Count -eq 0) { throw "FAIL: no '& git @gitArgs add -u|-A' line in $f" }
          $line = $hits[0].Line
          Write-Host "[validate-timer] Staging line: $line"
          if ($line -notmatch 'add -A\s*$') { throw "FAIL: expected '& git @gitArgs add -A', got: $line" }
          if ($line -match 'add -u\b') { throw "FAIL: unexpected add -u on staging line" }
          Write-Host "[validate-timer] PASS: generated script uses git add -A"

      # ── CI log samples: commit message demos ─
      - name: "CI samples: commit message shapes (Linux)"
        if: runner.os == 'Linux'
        run: |
          echo "[validate-timer] ci-commit-message-demos.sh"
          bash .github/scripts/ci-commit-message-demos.sh
          echo "[validate-timer] ci-commit-message-demos.sh ok"

      - name: "CI samples: commit message shapes (Windows)"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "[validate-timer] ci-commit-message-demos.ps1"
          pwsh .github/scripts/ci-commit-message-demos.ps1
          Write-Host "[validate-timer] ci-commit-message-demos.ps1 ok"

      # ── dotfiles-update: clean-merge case ────────────────────────────────
      # Advance origin/master with a brand-new system file (no overlap with the
      # machine's tree), then `dotfiles-update` must fetch + merge it cleanly.
      - name: "dotfiles-update: clean merge (Linux)"
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          dotfiles() { git --git-dir="$HOME/.dotfiles/" --work-tree="$HOME" "$@"; }
          cd "$HOME"

          echo "[validate-timer] advance origin/master via scratch clone"
          rm -rf /tmp/df-scratch
          git clone /tmp/dotfiles-remote.git /tmp/df-scratch
          ( cd /tmp/df-scratch
            git checkout master
            printf 'system improvement\n' > .dotfiles/SYSTEM_NEW.txt
            git add -f .dotfiles/SYSTEM_NEW.txt
            git commit -m "feat(system): add SYSTEM_NEW marker"
            git push origin master )

          echo "[validate-timer] dotfiles-update (clean) -> expect exit 0 + file present"
          bash "$HOME/.dotfiles/dotfiles-update.sh"
          test -f "$HOME/.dotfiles/SYSTEM_NEW.txt" \
            || { echo "FAIL: SYSTEM_NEW.txt not merged into work-tree"; exit 1; }
          dotfiles merge-base --is-ancestor origin/master HEAD \
            || { echo "FAIL: origin/master not merged into HEAD"; exit 1; }
          echo "[validate-timer] PASS: clean merge propagated origin/master"

      - name: "dotfiles-update: clean merge (Windows)"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function dotfiles { git --git-dir="$HOME/.dotfiles/" --work-tree="$HOME" @args }
          Set-Location $HOME

          Write-Host "[validate-timer] advance origin/master via scratch clone"
          Remove-Item -Recurse -Force C:\df-scratch -ErrorAction SilentlyContinue
          git clone C:\dotfiles-remote.git C:\df-scratch
          Push-Location C:\df-scratch
          try {
              git checkout master
              "system improvement" | Set-Content .dotfiles\SYSTEM_NEW.txt
              git add -f .dotfiles/SYSTEM_NEW.txt
              git commit -m "feat(system): add SYSTEM_NEW marker"
              git push origin master
          } finally { Pop-Location }

          Write-Host "[validate-timer] dotfiles-update (clean) -> expect exit 0 + file present"
          pwsh "$HOME\.dotfiles\dotfiles-update.ps1"
          if ($LASTEXITCODE -ne 0) { throw "FAIL: dotfiles-update exited $LASTEXITCODE on clean merge" }
          if (-not (Test-Path "$HOME\.dotfiles\SYSTEM_NEW.txt")) { throw "FAIL: SYSTEM_NEW.txt not merged" }
          dotfiles merge-base --is-ancestor origin/master HEAD
          if ($LASTEXITCODE -ne 0) { throw "FAIL: origin/master not merged into HEAD" }
          Write-Host "[validate-timer] PASS: clean merge propagated origin/master"

      # ── dotfiles-update: conflict case ───────────────────────────────────
      # Diverge the same file on both sides: the machine edits a tracked file,
      # origin/master edits the same region. `dotfiles-update` must print a loud
      # message, list the conflict, abort the merge (clean tree), and exit 1.
      - name: "dotfiles-update: conflict aborts (Linux)"
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -uo pipefail
          dotfiles() { git --git-dir="$HOME/.dotfiles/" --work-tree="$HOME" "$@"; }
          cd "$HOME"

          echo "[validate-timer] remote edits CONFLICT.txt one way"
          rm -rf /tmp/df-scratch2
          git clone /tmp/dotfiles-remote.git /tmp/df-scratch2
          ( cd /tmp/df-scratch2
            git checkout master
            printf 'remote-side line\n' > .dotfiles/CONFLICT.txt
            git add -f .dotfiles/CONFLICT.txt
            git commit -m "feat(system): CONFLICT.txt remote edit"
            git push origin master )

          echo "[validate-timer] machine edits CONFLICT.txt the other way"
          printf 'machine-side line\n' > "$HOME/.dotfiles/CONFLICT.txt"
          dotfiles add -f .dotfiles/CONFLICT.txt
          dotfiles commit -m "local: CONFLICT.txt machine edit"
          HEAD_BEFORE=$(dotfiles rev-parse HEAD)

          echo "[validate-timer] dotfiles-update (conflict) -> expect exit 1 + abort"
          set +e
          OUT=$(bash "$HOME/.dotfiles/dotfiles-update.sh" 2>&1); RC=$?
          set -e
          echo "$OUT"
          [ "$RC" -eq 1 ] || { echo "FAIL: expected exit 1, got $RC"; exit 1; }
          echo "$OUT" | grep -q "DOTFILES UPDATE CONFLICT" \
            || { echo "FAIL: missing loud conflict message"; exit 1; }
          echo "$OUT" | grep -q "CONFLICT.txt" \
            || { echo "FAIL: conflicting file not listed"; exit 1; }
          # merge aborted: HEAD unchanged + no MERGE_HEAD + clean status
          [ "$(dotfiles rev-parse HEAD)" = "$HEAD_BEFORE" ] \
            || { echo "FAIL: HEAD moved despite abort"; exit 1; }
          test ! -f "$HOME/.dotfiles/MERGE_HEAD" \
            || { echo "FAIL: MERGE_HEAD present — merge not aborted"; exit 1; }
          [ -z "$(dotfiles status --porcelain)" ] \
            || { echo "FAIL: work-tree not clean after abort"; dotfiles status --porcelain; exit 1; }
          echo "[validate-timer] PASS: conflict aborted, tree clean, exit 1"

      - name: "dotfiles-update: conflict aborts (Windows)"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function dotfiles { git --git-dir="$HOME/.dotfiles/" --work-tree="$HOME" @args }
          Set-Location $HOME

          Write-Host "[validate-timer] remote edits CONFLICT.txt one way"
          Remove-Item -Recurse -Force C:\df-scratch2 -ErrorAction SilentlyContinue
          git clone C:\dotfiles-remote.git C:\df-scratch2
          Push-Location C:\df-scratch2
          try {
              git checkout master
              "remote-side line" | Set-Content .dotfiles\CONFLICT.txt
              git add -f .dotfiles/CONFLICT.txt
              git commit -m "feat(system): CONFLICT.txt remote edit"
              git push origin master
          } finally { Pop-Location }

          Write-Host "[validate-timer] machine edits CONFLICT.txt the other way"
          "machine-side line" | Set-Content "$HOME\.dotfiles\CONFLICT.txt"
          dotfiles add -f .dotfiles/CONFLICT.txt
          dotfiles commit -m "local: CONFLICT.txt machine edit"
          $headBefore = (dotfiles rev-parse HEAD)

          Write-Host "[validate-timer] dotfiles-update (conflict) -> expect exit 1 + abort"
          $out = pwsh "$HOME\.dotfiles\dotfiles-update.ps1" 2>&1 | Out-String
          $rc = $LASTEXITCODE
          Write-Host $out
          if ($rc -ne 1) { throw "FAIL: expected exit 1, got $rc" }
          if ($out -notmatch 'DOTFILES UPDATE CONFLICT') { throw "FAIL: missing loud conflict message" }
          if ($out -notmatch 'CONFLICT\.txt') { throw "FAIL: conflicting file not listed" }
          if ((dotfiles rev-parse HEAD) -ne $headBefore) { throw "FAIL: HEAD moved despite abort" }
          if (Test-Path "$HOME\.dotfiles\MERGE_HEAD") { throw "FAIL: MERGE_HEAD present — merge not aborted" }
          $status = (dotfiles status --porcelain | Out-String).Trim()
          if ($status) { throw "FAIL: work-tree not clean after abort:`n$status" }
          Write-Host "[validate-timer] PASS: conflict aborted, tree clean, exit 1"
