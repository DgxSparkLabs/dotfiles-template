name: Validate Timer Scripts (superseded)

# SUPERSEDED by node 9. The legacy timer baked a single-repo add/commit/push payload
# (.auto-commit.sh / git add -u|-A) into one OS unit; the new single timer's payload calls
# `dotfiles -tick`, which fans out over ALL repos under ~/.dotfiles/bare-repos/. The timer is
# now validated by tests/test_timer.{sh,ps1} (L3.1/L3.4/L3.9/L3.11/L3.12/L3.13/L3.14 +
# install/enable/disable/status/logs/uninstall), run on every push by the `unit` workflow across
# ubuntu + macos + windows (the ubuntu leg exposes a systemd user session so the live-manager
# assertions run instead of skipping).
#
# Kept manual-only so the file stays referenceable; it intentionally does nothing.
on:
  workflow_dispatch:

jobs:
  superseded:
    runs-on: ubuntu-latest
    steps:
      - name: Note supersession
        run: |
          echo "Timer validation moved to tests/test_timer.{sh,ps1} under the 'unit' workflow."
          echo "See node 9 in the build plan; this workflow is intentionally a no-op."
